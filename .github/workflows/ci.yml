name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native search services
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Test Go fetcher
        run: cd search-fetcher && go test ./...
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust search core
        run: cargo test --manifest-path search-core/Cargo.toml

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mcp-gateway/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e 'mcp-gateway[dev]'
      - name: Compile Python sources
        run: python -m compileall -q mcp-gateway/src tests
      - name: Run test suite
        run: >-
          python -m pytest -q
          tests/test_bench_search_live.py
          tests/test_search_extended.py
          tests/test_search_integrity_bench.py
          tests/test_reader_search.py
          tests/test_reader_extended.py
          tests/test_gateway_contract.py
          tests/test_reranker.py
          tests/test_embeddings.py

  config:
    name: Validate YAML and Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Parse repository YAML
        run: python -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.').rglob('*.y*ml') if '.git' not in p.parts]"
      - name: Validate Compose model
        run: cp .env.example .env && docker compose config --quiet
