[project]
name = "jina-local-mcp-gateway"
version = "0.1.0"
description = "本地替代 jina.ai 的 MCP 网关，聚合 Reader/Search/Reranker/Embeddings，部署于 RTX 5070"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0", "httpx", "pydantic>=2", "requests", "trafilatura", "beautifulsoup4[lxml]", "lxml", "pyyaml", "readability-lxml", "lxml_html_clean"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pyyaml", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
