services:
  embeddings:
    # Blackwell 5070 专用: 120-1.9 (CUDA 12/13.2 Blackwell sm_120)，需 NVIDIA Container Toolkit + 驱动 595.84
    # fallback 通用标签: ghcr.io/huggingface/text-embeddings-inference:1.9 (非 Blackwell，老卡兼容)
    # 版本见 docs/images.md；hf-cache 为共享单一 volume 已验证（embeddings/reranker 共用）
    image: ghcr.io/huggingface/text-embeddings-inference:120-1.9
    # digest 固定示例（需 docker pull 后以 `docker inspect --format='{{.RepoDigests}}'` 覆写）:
    # image: ghcr.io/huggingface/text-embeddings-inference:120-1.9@sha256:PLACEHOLDER_EMBEDDINGS_DIGEST
    pull_policy: missing
    command: --model-id BAAI/bge-m3 --dtype float16 --max-batch-tokens 16384 --max-concurrent-requests 64 --port 3001
    network_mode: host
    environment:
      HF_HUB_OFFLINE: "0"
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      NO_PROXY: localhost,127.0.0.1
      CUDA_VISIBLE_DEVICES: "0"
      CACHE_DIR: /tmp/opencode/jina-local
    ports: []
    volumes:
      - hf-cache:/data
      - /tmp/opencode:/tmp/opencode
    restart: unless-stopped
    runtime: nvidia
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  reranker:
    # Blackwell 5070 专用: 120-1.9，fallback 通用 1.9 见注释
    # fallback: ghcr.io/huggingface/text-embeddings-inference:1.9
    # 共享 hf-cache 卷（单一 volume `hf-cache:/data`，两服务共用，减少 28K->共享后零冗余）
    image: ghcr.io/huggingface/text-embeddings-inference:120-1.9
    # image: ghcr.io/huggingface/text-embeddings-inference:120-1.9@sha256:PLACEHOLDER_RERANKER_DIGEST
    pull_policy: missing
    command: --model-id BAAI/bge-reranker-v2-m3 --dtype float16 --max-batch-tokens 16384 --max-concurrent-requests 64 --port 3002
    network_mode: host
    environment:
      HF_HUB_OFFLINE: "0"
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      NO_PROXY: localhost,127.0.0.1
      CUDA_VISIBLE_DEVICES: "0"
    ports: []
    volumes:
      - hf-cache:/data
      - /tmp/opencode:/tmp/opencode
    restart: unless-stopped
    runtime: nvidia
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  reader:
    # crawl4ai 为 CPU 密集 I/O，无需 GPU；增加 profiles 避免全量启动（默认不启动，需 --profile full/reader）
    image: unclecode/crawl4ai:latest
    # pin digest 示例: unclecode/crawl4ai:0.6.3@sha256:PLACEHOLDER_CRAWL4AI_DIGEST
    pull_policy: missing
    profiles: ["full", "reader"]
    ports:
      - "3003:11235"
    volumes:
      - /tmp/opencode:/tmp/opencode
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # reader/crawl4ai 为 CPU 密集 I/O，无需 GPU，避免浪费显存；GPU 仅分配给 embeddings/reranker

  search:
    # searxng 增加 profiles 避免全量启动（默认不启动，需 --profile full/search）
    image: searxng/searxng:latest
    # pin digest 示例: searxng/searxng:2025.9.1@sha256:PLACEHOLDER_SEARXNG_DIGEST
    pull_policy: missing
    profiles: ["full", "search"]
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
      - /tmp/opencode:/tmp/opencode
    env_file: .env
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp

  qdrant:
    image: qdrant/qdrant:latest
    # pin digest 示例: qdrant/qdrant:v1.13.2@sha256:PLACEHOLDER_QDRANT_DIGEST
    pull_policy: missing
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
      - /tmp/opencode:/tmp/opencode
    env_file: .env
    restart: unless-stopped

volumes:
  hf-cache:
  qdrant-storage:
